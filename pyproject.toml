[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldscreen"
version = "0.1.0.dev0"
description = "First-pass screening memos for UK companies, built from public registry data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["companies-house", "screening", "due-diligence", "uk", "registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    # Direct dependency (already in the tree under httpx): the site stage
    # installs a custom httpcore network backend so that DNS resolution,
    # address validation, and the actual TCP connect share one resolution
    # (the anti-rebinding pin in coldscreen.site).
    "httpcore>=1.0",
    "pydantic>=2.12",
    "typer>=0.12",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    # Deck text extraction. MIT with a permissive dependency chain; the
    # licence verification is recorded in wiki/research/pdf-licensing.md and
    # DECISIONS.md (2026-08-18).
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
# Model provider SDKs are optional extras: the core tool works with none of
# them (deterministic screen) or with Ollama alone (plain httpx, no SDK).
anthropic = [
    "anthropic>=0.122",
]
openai = [
    # openai v3 depends on httpx2 (a separate distribution), which coexists
    # with this project's httpx pin. Verified at install time 2026-08-18.
    "openai>=3.2",
]
# MCP server mode (stdio). The official Model Context Protocol Python SDK,
# distribution "mcp" on PyPI, MIT licensed. Verified against the installed
# 2.0.0 package (DECISIONS.md, 2026-08-19). Not a default dependency: the
# CLI is the primary interface and imports this lazily. Plain "mcp", not
# "mcp[cli]"; the third-party "fastmcp" distribution is a different package
# and is not used.
mcp = [
    "mcp>=2,<3",
]
all = [
    "coldscreen[anthropic,mcp,openai]",
]
dev = [
    "pytest>=8.2",
    # Network isolation is enforced, not claimed: sockets are disabled for
    # the whole test run (see tool.pytest.ini_options addopts). respx mocks
    # at the httpx transport layer and needs no sockets.
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    # Both provider SDKs and the MCP server extra, so CI exercises every
    # optional import path including the MCP tool tests.
    "coldscreen[anthropic,mcp,openai]",
]

[project.scripts]
coldscreen = "coldscreen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coldscreen"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Ruff 0.16+ formats fenced code blocks inside Markdown. The Markdown files
# here are project documents whose code sketches are illustrative, not code
# under this tool's control, so they stay out of lint and format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "scripts"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-socket makes "no network in tests" mechanical: any socket
# creation fails the test. DNS via getaddrinfo does not use a socket
# object, so tests/conftest.py additionally stubs the site resolver.
addopts = "-q --disable-socket"
