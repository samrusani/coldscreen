[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstpass-screen"
version = "0.1.0.dev0"
description = "First-pass screening memos for UK companies, built from public registry data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["companies-house", "screening", "due-diligence", "uk", "registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
firstpass = "firstpass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firstpass"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Ruff 0.16+ formats fenced code blocks inside Markdown. The Markdown files
# here are project documents whose code sketches are illustrative, not code
# under this tool's control, so they stay out of lint and format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "scripts"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
