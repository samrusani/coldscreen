name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; nothing here writes back.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to commit SHAs; the trailing comment names the
      # tag the SHA was resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        # setup-uv provisions a .venv of its own, so clear it rather than
        # failing on "already exists".
        run: |
          uv venv --clear --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests (no network, fixtures only)
        # Two belts: pytest-socket disables sockets inside pytest (see
        # pyproject addopts), and dead proxies make any escape attempt from
        # a subprocess or an unguarded client fail fast at the transport.
        # GitHub env keys are case insensitive, so only the lowercase forms
        # are set here; httpx and requests both honor them. pytest-socket is
        # the primary control, this proxy belt is defense in depth.
        env:
          http_proxy: "http://127.0.0.1:9"
          https_proxy: "http://127.0.0.1:9"
          no_proxy: ""
        run: uv run pytest

      - name: Language check
        run: uv run python scripts/check_language.py

  package:
    # The wheel installs into a clean venv and works from the installed
    # package alone: version flag plus the offline rerun demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/pkg-env" --python 3.12
          uv pip install --python "$RUNNER_TEMP/pkg-env/bin/python" dist/*.whl

      - name: coldscreen --version
        run: |
          "$RUNNER_TEMP/pkg-env/bin/coldscreen" --version

      - name: Offline rerun demo from the installed package
        env:
          http_proxy: "http://127.0.0.1:9"
          https_proxy: "http://127.0.0.1:9"
        run: |
          cp -r tests/fixtures/case-fabricated-widgets-ltd-99999999 "$RUNNER_TEMP/demo-case"
          rm "$RUNNER_TEMP/demo-case/memo.md"
          "$RUNNER_TEMP/pkg-env/bin/coldscreen" rerun "$RUNNER_TEMP/demo-case" --render-only
          diff "$RUNNER_TEMP/demo-case/memo.md" tests/fixtures/case-fabricated-widgets-ltd-99999999/memo.md

      - name: Language check from the installed package
        run: |
          "$RUNNER_TEMP/pkg-env/bin/coldscreen" check-language "$RUNNER_TEMP/demo-case/memo.md"

  audit:
    # pip-audit over the environment created by installing the built wheel:
    # exactly the dependency set a user resolves. Blocking by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel and pip-audit into a clean venv
        run: |
          uv venv --seed "$RUNNER_TEMP/audit-env" --python 3.12
          uv pip install --python "$RUNNER_TEMP/audit-env/bin/python" dist/*.whl pip-audit

      - name: pip-audit the resolved dependencies
        run: |
          "$RUNNER_TEMP/audit-env/bin/pip-audit"
